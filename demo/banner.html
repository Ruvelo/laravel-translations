<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- Rendered at 1280×640 into art/banner.png by demo/screenshots.sh. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap">
    <style>
        html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #fff; color: #18181b; color-scheme: light; }
        body { position: relative; font-family: "Geist", sans-serif; -webkit-font-smoothing: antialiased; }
        .copy { position: absolute; left: 72px; top: 64px; width: 560px; }
        .mark { display: flex; align-items: center; gap: 14px; font: 600 24px/1 "Geist"; letter-spacing: -.02em; }
        .mark img { width: 40px; height: 40px; }
        .mark span { color: #71717a; font-weight: 500; }
        h1 { font: 600 62px/1.02 "Geist"; letter-spacing: -.05em; margin: 72px 0 24px; }
        p { font: 400 22px/1.5 "Geist"; color: #52525b; margin: 0 0 36px; letter-spacing: -.01em; }
        code { display: inline-block; font: 400 18px/1 "Geist Mono", monospace; background: #f4f4f5; border-radius: 10px; padding: 16px 20px; }
        code::before { content: "$ "; color: #71717a; }
        .shot { position: absolute; left: 680px; top: 72px; width: 900px; border: 1px solid #e4e4e7; border-radius: 16px; box-shadow: 0 1px 2px rgb(24 24 27 / .04), 0 30px 70px -30px rgb(61 78 255 / .45); }
    </style>
</head>
<body>
    <div class="copy">
        <div class="mark"><img src="ruvelo-mark.svg" alt="">Laravel Translations <span>by Ruvelo</span></div>
        <h1>Translate your Laravel app where it runs.</h1>
        <p>See what's missing, fix strings right on the page, and export every change back to your lang files.</p>
        <code>composer require ruvelo/laravel-translations</code>
    </div>
    <img class="shot" src="laravel-translations/art/screenshot-editor.png" alt="">
</body>
</html>
